pre-commit:
  parallel: true
  jobs:
    - name: prettier
      glob: '*.{js,ts,svelte,css,md,json,yaml,yml}'
      run: pnpm exec prettier --check {staged_files}

    - name: eslint
      glob: '*.{js,ts,svelte}'
      run: pnpm exec eslint --no-warn-ignored {staged_files}

    - name: svelte-check
      glob: '*.{svelte,ts}'
      run: pnpm exec svelte-check --tsconfig ./tsconfig.json --fail-on-warnings

pre-push:
  jobs:
    - name: build
      run: pnpm build
